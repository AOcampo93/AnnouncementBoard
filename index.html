<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quadro de avisos da ala: novidades, quadros por organização e publicação de avisos.">
<meta name="theme-color" content="#e3d6ba">
<title>Quadro de Avisos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- Conjunto de ícones: traço de 2,2, no mesmo tom de tinta dos contornos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-feed" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4.5M11 5.5 4.5 12l6.5 6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3.5h3l1.6 4-2 1.4a11.5 11.5 0 0 0 5.5 5.5l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A15.6 15.6 0 0 1 4 5.7 2 2 0 0 1 6 3.5z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l2.8-2.8a4 4 0 1 0-5.7-5.7L11.4 6.4"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-2.8 2.8a4 4 0 1 0 5.7 5.7l1.4-1.4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="18.5" r="2.8"/><path d="m8.5 10.7 7-3.4M8.5 13.3l7 3.4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.6 2.6 0 0 0-3.7-3.7L4 16.4z"/><path d="m14.5 6.5 3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7"/><path d="M6.5 6.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.5"/><path d="M10.5 10v7M13.5 10v7"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 5.5H6.2A1.7 1.7 0 0 0 4.5 7.2v9.3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M13.5 3.5v5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m5 17 4.5-4.5 3.5 3 2.5-2.5L20 17"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13M6 12l6 6 6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3"/><path d="M17 20V4M14 7l3-3 3 3"/></symbol>
  </defs>
</svg>

<div class="layout">

  <!-- Barra lateral: só em ambiente de trabalho (1120px+) -->
  <aside class="rail">
    <button class="rail__brand" data-act="ir" data-hash="#/novidades" aria-label="Ir para as novidades">
      <span class="rail__mark"><svg class="ico" aria-hidden="true"><use href="#i-feed"></use></svg></span>
      <span class="rail__brandtxt">
        <span class="rail__sub">Ala de Leiria</span>
        <span class="rail__name">Quadro de Avisos</span>
      </span>
    </button>

    <nav class="rail__nav" id="rail-nav" aria-label="Secções"></nav>

    <div class="rail__section">
      <p class="eyebrow eyebrow--dark">Quadros</p>
      <div class="rail__boards" id="rail-boards"></div>
    </div>

    <div class="rail__foot">
      <button class="rail__user" id="rail-user"></button>
      <div id="rail-cta"></div>
    </div>
  </aside>

  <!-- Zona principal -->
  <div class="main" id="main">
    <!-- Barra superior: só em tablet (768–1119px) -->
    <nav class="toprail" aria-label="Secções">
      <button class="toprail__brand" data-act="ir" data-hash="#/novidades" aria-label="Ir para as novidades">
        <svg class="ico" aria-hidden="true"><use href="#i-feed"></use></svg>
        Quadro
      </button>
      <span id="toprail-nav" style="display:contents"></span>
    </nav>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- Barra de separadores: só em telemóvel (até 767px) -->
<nav class="tabbar" id="tabbar" aria-label="Secções"></nav>

<!-- Comando da demonstração -->
<button class="demotoggle" data-act="demo" aria-label="Opções da demonstração">
  <svg class="ico" aria-hidden="true"><use href="#i-sliders"></use></svg>
</button>

<!-- Mensagem: nó permanente, para sobreviver à mudança de ecrã -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Sobreposições -->
<div id="camadas"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
